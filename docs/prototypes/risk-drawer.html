<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>泌尿科工具 · 右側抽屜原型</title>
<style>
:root{font-family:system-ui,sans-serif;color:#223d3a;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:60px auto;padding:24px}h1{font-size:28px}p{line-height:1.7}.hint{color:#58726b;font-size:14px}.tools{display:flex;flex-wrap:wrap;gap:12px}button{font:inherit;cursor:pointer;border:1px solid #c5d8d0;border-radius:12px;background:white;padding:12px 18px;color:#23483d}button:hover{background:#e8f3ed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #528fbd;outline-offset:3px}.primary{background:#28614f;color:white}.primary:hover{background:#204c40}.card{background:white;padding:22px;border:1px solid #dce6e0;border-radius:16px;margin-top:18px}.badge{display:inline-block;background:#ecf0dc;padding:5px 10px;border-radius:8px;font-size:13px}dialog{border:0;padding:0;margin:0 0 0 auto;width:min(480px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;color:inherit;box-shadow:-12px 0 48px #15362b33;animation:slide .2s ease-out}dialog::backdrop{background:#19382f66}.panel{padding:24px;display:flex;flex-direction:column;min-height:100%}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h2{font-size:22px}.fields{flex:1}label{display:block;margin:20px 0 8px;font-weight:600}input,select{width:100%;font:inherit;padding:13px;border:1px solid #bbcec4;border-radius:10px;background:white;color:inherit}.actions{display:flex;gap:12px;margin-top:26px}.notice{background:#f6f1df;padding:13px;border-radius:10px;font-size:14px}.error{color:#973f26}a{color:#28614f}@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}@media(prefers-reduced-motion:reduce){dialog{animation:none}}@media(max-width:600px){main{margin:15px auto}.tools button{flex:1 1 40%}}
</style>
<main><span class="badge">獨立介面原型 · 未整合正式網站</span><h1>泌尿科臨床工具</h1><p>點選工具，右側出現輸入選單。完成必要欄位後收回，結果留在主畫面。</p><p class="notice">PSAD 提供算術值；癌症分類器尚未實作，只展示互動與待驗證狀態。此原型不登入、不儲存資料。</p><div class="tools" id="tools"></div><section id="results" aria-live="polite"><p class="hint" id="empty">尚未完成任何工具。</p></section></main>
<dialog id="drawer" aria-labelledby="heading"><form class="panel" id="form"><div class="head"><h2 id="heading"></h2><button type="button" id="close" aria-label="關閉選單">✕</button></div><p class="hint" id="description"></p><div class="fields" id="fields"></div><p class="error" id="error" role="alert"></p><p class="hint">選擇型工具填完全部必填會自動收回。数值工具填完後按「完成」，避免輸入途中收回。</p><div class="actions"><button class="primary" type="submit">完成並收回</button><button type="button" id="cancel">取消</button></div></form></dialog>
<script>
const configurations={
 psad:{name:'PSA density',description:'PSA ÷ 攝護腺體積。結果不是癌症風險分組。',fields:[['PSA (ng/mL)','number'],['攝護腺體積 (mL / cc)','number']]},
 prostate:{name:'攝護腺癌 · EAU',description:'正式版將依 PSA、ISUP GG、DRE cT、N/M 判定。',fields:[['ISUP Grade Group',['1','2','3','4','5','未知']],['臨床 cT（DRE）',['cT1','cT2','cT3','cT4','未知']],['N/M 狀態',['N0 M0','N1 M0','M1','未知']]]},
 bladder:{name:'膀胱癌 · EAU / AUA',description:'正式版將共用資料，分別顯示兩套 NMIBC 分組。',fields:[['Stage',['Ta','T1','CIS / Tis','T2+','未知']],['Grade（示意）',['Low grade','High grade','未知']],['CIS',['有','無','未知']]]},
 rcc:{name:'腎癌 · 術後風險',description:'正式版將依組織型選擇模型，與轉移性 RCC 的 IMDC 分開。',fields:[['情境',['術後 M0','尚未手術','轉移性疾病','未知']],['組織型',['Clear cell RCC','Non-clear cell RCC','未知']],['病理 pT',['pT1a','pT1b','pT2','pT3','pT4','未知']]]},
 utuc:{name:'UTUC · EAU',description:'正式版將區分術前強因子與弱因子，缺資料不自動判定低風險。',fields:[['Biopsy grade',['Low grade','High grade','未知']],['影像局部侵犯',['有','無','未知']],['尿液細胞學',['High grade','非 High grade','未知']]]}
};
const drawer=document.getElementById('drawer'),fields=document.getElementById('fields'),form=document.getElementById('form'),results=document.getElementById('results');
const drafts={},cards={};let active=null,opener=null;
for(const [id,c] of Object.entries(configurations)){const b=document.createElement('button');b.textContent=c.name;b.onclick=()=>openTool(id,b);document.getElementById('tools').append(b)}
function openTool(id,b){active=id;opener=b;const c=configurations[id];document.getElementById('heading').textContent=c.name;document.getElementById('description').textContent=c.description;document.getElementById('error').textContent='';fields.replaceChildren();c.fields.forEach(([label,type],i)=>{const l=document.createElement('label');l.htmlFor='field-'+i;l.textContent=label;const el=document.createElement(type==='number'?'input':'select');el.id='field-'+i;el.name='field'+i;el.required=true;if(type==='number'){el.type='number';el.step='any';el.min=i===0?'0':'0.000001'}else{el.add(new Option('請點選…',''));for(const value of type)el.add(new Option(value,value))}el.value=(drafts[id]||[])[i]||'';fields.append(l,el)});drawer.showModal()}
function values(){return Array.from(fields.querySelectorAll('input,select')).map(el=>el.value)}
function closeDrawer(){if(active)drafts[active]=values();drawer.close();if(opener)opener.focus()}
document.getElementById('close').onclick=closeDrawer;document.getElementById('cancel').onclick=closeDrawer;
drawer.addEventListener('cancel',e=>{e.preventDefault();closeDrawer()});
form.addEventListener('input',()=>{drafts[active]=values();if(cards[active])cards[active].querySelector('p').textContent='資料已修改，結果待重新完成。'});
form.addEventListener('change',()=>{if(active!=='psad'&&values().every(v=>v!==''))form.requestSubmit()});
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const c=configurations[active],v=values();let message;
 if(active==='psad'){const psa=Number(v[0]),vol=Number(v[1]);if(!Number.isFinite(psa)||!Number.isFinite(vol)||psa<0||vol<=0||!Number.isFinite(psa/vol)){document.getElementById('error').textContent='請輸入有效 PSA 與大於零的體積。';return}message='PSAD = '+(psa/vol).toFixed(3)+' ng/mL/cc · 算式 '+psa+' ÷ '+vol+'。尚未提供情境風險解讀。'}
 else{message='風險分組：待完整規則驗證。'+(v.includes('未知')?'另有未知資料，正式版需檢查缺少的必要欄位。':'此畫面僅示範輸入完成後的結果呈現。')}
 let card=cards[active];if(!card){card=document.createElement('article');card.className='card';cards[active]=card;results.append(card)}card.replaceChildren();const title=document.createElement('h3');title.textContent=c.name;const p=document.createElement('p');p.textContent=message;const detail=document.createElement('p');detail.className='hint';detail.textContent=c.fields.map(([label],i)=>label+'：'+v[i]).join(' · ');const id=active,edit=document.createElement('button');edit.textContent='修改';edit.onclick=()=>openTool(id,edit);card.append(title,p,detail,edit);document.getElementById('empty').hidden=true;closeDrawer();
});
</script></html>
