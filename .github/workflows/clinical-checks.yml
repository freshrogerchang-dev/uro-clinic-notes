name: Clinical rule checks
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/clinical-core.test.cjs
      - run: node --check assets/clinical-core.js
      - run: node --check assets/clinical-tools.js
